<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — El Rincón del Carmen</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>

  <header id="main-header"></header>

  <main class="auth-page">
    <div class="auth-box">
      <p class="auth-eyebrow">✦ Bienvenido de vuelta</p>
      <h1 class="auth-title display">Inicia Sesión</h1>
      <p class="auth-sub">Accede para gestionar tus reservas y preferencias.</p>

      <form id="login-form" class="auth-form">
        <div class="input-group">
          <label for="username">Correo electrónico</label>
          <input type="text" id="username" placeholder="tu@correo.com o admin" required autocomplete="email">
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-gold">Ingresar</button>
        </div>
      </form>

      <div class="auth-footer">
        <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
      </div>
      <p class="auth-hint">Panel admin: usa <strong>admin / admin</strong></p>
    </div>
  </main>

  <script src="main.js" type="module"></script>
</body>
</html>
